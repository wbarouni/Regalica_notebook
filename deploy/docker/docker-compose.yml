volumes:
  pg_data:
  redis_data:
  ollama_models:
  uploads:
  embedder_cache:
  reranker_cache:

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: notebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebook"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # Change host port to avoid conflicts with a local Postgres
    ports: ["5433:5432"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports: ["6379:6379"]
    restart: unless-stopped

  # ========================================
  # OLLAMA CLUSTER - STATE-OF-THE-ART 2025
  # 4 instances + NGINX load balancer
  # ========================================

  # NGINX Load Balancer (smart routing)
  ollama-lb:
    image: nginx:alpine
    volumes:
      - ./nginx-ollama-smart.conf:/etc/nginx/nginx.conf:ro
    ports: ["11434:80"]
    depends_on:
      - ollama-micro
      - ollama-fast-1
      - ollama-fast-2
      - ollama-deep
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MICRO: TinyLlama (Core 0 - ultra-fast 8-12s)
  ollama-micro:
    image: ollama/ollama:latest
    cpuset: "0"
    environment:
      OLLAMA_HOST: "0.0.0.0:11435"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # FAST-1: Qwen2.5 3B (Cores 2-3 - fast 25-35s)
  ollama-fast-1:
    image: ollama/ollama:latest
    cpuset: "2,3"
    environment:
      OLLAMA_HOST: "0.0.0.0:11436"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # FAST-2: Qwen2.5 3B (Cores 4-5 - fast 25-35s)
  ollama-fast-2:
    image: ollama/ollama:latest
    cpuset: "4,5"
    environment:
      OLLAMA_HOST: "0.0.0.0:11437"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # DEEP: Qwen2.5 7B (Cores 6-7 - quality 45-60s)
  ollama-deep:
    image: ollama/ollama:latest
    cpuset: "6,7"
    environment:
      OLLAMA_HOST: "0.0.0.0:11438"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  embedder:
    build: ../../embedder
    environment:
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - embedder_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    ports: ["8000:8000"]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  reranker:
    build: ../../reranker
    environment:
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      HOST: 0.0.0.0
      PORT: 8001
    volumes:
      - reranker_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    ports: ["8001:8001"]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  clusterer:
    build: ../../clusterer
    environment:
      MIN_CLUSTER_SIZE: ${MIN_CLUSTER_SIZE:-5}
      MIN_SAMPLES: ${MIN_SAMPLES:-5}
      METRIC: ${METRIC:-cosine}
      REDUCE_DIM: ${REDUCE_DIM:-50}
      HOST: 0.0.0.0
      PORT: 8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    ports: ["8002:8002"]

  backend:
    build: ../../backend
    environment:
      SERVER_PORT: 5200
      LOG_LEVEL: info
      DB_URL: postgres://postgres:postgres@postgres:5432/notebook
      DB_SCHEMA: nbk
      MAX_UPLOAD_MB: 100
      EMBED_API_URL: http://embedder:8000
      RERANKER_API_URL: http://reranker:8001
      LLM_API_URL: http://ollama-lb
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen2.5:3b-instruct-q4_k_m}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-qwen2.5:3b-instruct-q4_k_m}
      LLM_MODEL_DEEP: ${LLM_MODEL_DEEP:-qwen2:7b-instruct-q4_k_m}
      LLM_MODEL_MICRO: ${LLM_MODEL_MICRO:-tinyllama:latest}
      LLM_CHAT_TIMEOUT_MS: 120000
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-intfloat/multilingual-e5-large}
      CHUNK_TOKENS_MAX: 1800
      CHUNK_OVERLAP_PCT: 0.25
      ALLOWED_MIME: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/html,text/plain
      OCR_ENABLE: false
      CORS_ALLOWED_ORIGINS: http://localhost:4300
      FEATURE_REALTIME_MINDMAP: true
      CLUSTERER_API_URL: http://clusterer:8002
    volumes:
      - uploads:/app/uploads
      - ../../backend/src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5200/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports: ["5200:5200"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedder:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../../frontend
    environment:
      NG_APP_API_BASE_URL: http://localhost:5200
      NG_APP_MAX_UPLOAD_MB: 100
      NG_APP_PAGE_SIZE: 20
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Use 4300 on host to avoid clashing with local ng serve on 4200
    ports: ["4300:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
