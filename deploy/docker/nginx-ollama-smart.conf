events {
    worker_connections 1024;
}

http {
    # Upstream pour chaque tier
    upstream ollama_micro {
        server ollama-micro:11435 max_fails=2 fail_timeout=30s;
    }

    upstream ollama_fast {
        least_conn;
        server ollama-fast-1:11436 max_fails=2 fail_timeout=30s;
        server ollama-fast-2:11437 max_fails=2 fail_timeout=30s;
    }

    upstream ollama_deep {
        server ollama-deep:11438 max_fails=2 fail_timeout=30s;
    }

    # Map model name to appropriate upstream
    # Matches actual model names used in the system
    map $request_body $backend_tier {
        ~*"tinyllama"                    ollama_micro;
        ~*"qwen2\.5:3b"                  ollama_fast;
        ~*"qwen2\.5.*3b"                 ollama_fast;
        ~*"qwen2:7b"                     ollama_deep;
        ~*"qwen2\.5:7b"                  ollama_deep;
        ~*"qwen.*7b"                     ollama_deep;
        # Legacy/deprecated model name patterns (for backward compatibility)
        ~*"smollm2"                      ollama_micro;
        ~*"gemma3"                       ollama_fast;
        ~*"qwen3"                        ollama_deep;
        default                          ollama_fast;
    }

    server {
        listen 80;
        
        # Logging
        access_log /var/log/nginx/ollama_access.log;
        error_log /var/log/nginx/ollama_error.log;

        location / {
            # Route intelligently based on model in request
            proxy_pass http://$backend_tier;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Timeouts (generous for LLM inference)
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            
            # Buffering off for streaming
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
