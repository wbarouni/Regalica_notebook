# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    volumes:
      - ../../backend/src:/app/src:ro
      - ../../backend/package.json:/app/package.json:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    command: npm run dev

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    volumes:
      - ../../frontend/src:/app/src:ro
      - ../../frontend/angular.json:/app/angular.json:ro
      - ../../frontend/package.json:/app/package.json:ro
    environment:
      NODE_ENV: development
    ports:
      - "4200:4200"  # Use standard port for ng serve in dev

  # Reduce resource limits for development
  ollama-micro:
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  ollama-fast-1:
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  ollama-fast-2:
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  ollama-deep:
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 6G

  embedder:
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

  reranker:
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
